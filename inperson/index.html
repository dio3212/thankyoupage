<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>報名成功！歡迎加入即興表達課</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #F2A900;
    --gold-light: #FFF3D6;
    --dark: #1A1A2E;
    --dark2: #16213E;
    --white: #FFFFFF;
    --gray: #A0A0B0;
    --green: #2ECC71;
    --red: #E74C3C;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans TC', sans-serif;
    background: var(--dark);
    color: var(--white);
    min-height: 100vh;
    line-height: 1.7;
  }

  .container {
    max-width: 640px;
    margin: 0 auto;
    padding: 40px 24px 60px;
  }

  /* ===== SUCCESS BADGE ===== */
  .success-badge {
    text-align: center;
    margin-bottom: 36px;
  }

  .success-badge .checkmark {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: var(--green);
    margin-bottom: 16px;
    animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  .success-badge .checkmark svg {
    width: 36px;
    height: 36px;
    fill: none;
    stroke: var(--white);
    stroke-width: 3;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .success-badge h1 {
    font-size: 28px;
    font-weight: 900;
    margin-bottom: 8px;
  }

  .success-badge p {
    font-size: 16px;
    color: var(--gray);
  }

  /* ===== INFO BOX ===== */
  .info-box {
    background: var(--dark2);
    border: 1px solid rgba(242,169,0,0.2);
    border-radius: 14px;
    padding: 24px;
    margin-bottom: 28px;
  }

  .info-box h3 {
    font-size: 16px;
    color: var(--gold);
    margin-bottom: 12px;
    font-weight: 700;
  }

  .info-box p {
    font-size: 14px;
    color: #D0D0E0;
    margin-bottom: 8px;
  }

  .info-box p strong {
    color: var(--white);
  }

  /* ===== DIVIDER ===== */
  .divider {
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(242,169,0,0.3), transparent);
    margin: 32px 0;
  }

  /* ===== SURVEY ===== */
  .survey-section {
    background: linear-gradient(135deg, rgba(242,169,0,0.06), rgba(255,140,0,0.04));
    border: 1px solid rgba(242,169,0,0.25);
    border-radius: 14px;
    padding: 24px 22px;
    margin-bottom: 32px;
  }
  .survey-section h3 {
    font-size: 17px;
    font-weight: 700;
    margin-bottom: 6px;
    color: var(--white);
  }
  .survey-section .survey-sub {
    font-size: 13px;
    color: var(--gray);
    margin-bottom: 18px;
  }
  .survey-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
  }
  .survey-btn {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.12);
    color: var(--white);
    font-size: 14px;
    font-weight: 500;
    padding: 12px 14px;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.15s;
    text-align: left;
    font-family: inherit;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .survey-btn:hover {
    background: rgba(242,169,0,0.12);
    border-color: var(--gold);
    transform: translateY(-1px);
  }
  .survey-btn:disabled {
    cursor: default;
    opacity: 0.3;
    transform: none;
  }
  .survey-btn .icon {
    font-size: 18px;
  }
  .survey-thanks {
    text-align: center;
    padding: 20px 0;
    color: var(--gold);
    font-size: 16px;
    font-weight: 600;
    display: none;
  }
  .survey-thanks.show { display: block; }

  /* ===== FOOTER ===== */
  .footer {
    text-align: center;
    margin-top: 40px;
    padding-top: 24px;
    border-top: 1px solid rgba(255,255,255,0.06);
  }

  .footer p {
    font-size: 13px;
    color: var(--gray);
  }

  .footer a {
    color: var(--gold);
    text-decoration: none;
  }

  /* ===== ANIMATIONS ===== */
  @keyframes popIn {
    0% { transform: scale(0); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  @keyframes fadeUp {
    0% { transform: translateY(20px); opacity: 0; }
    100% { transform: translateY(0); opacity: 1; }
  }

  .fade-up {
    animation: fadeUp 0.6s ease-out forwards;
    opacity: 0;
  }

  .fade-up-d1 { animation-delay: 0.1s; }
  .fade-up-d2 { animation-delay: 0.2s; }
  .fade-up-d3 { animation-delay: 0.4s; }

  /* ===== MOBILE ===== */
  @media (max-width: 480px) {
    .container { padding: 32px 16px 48px; }
    .success-badge h1 { font-size: 24px; }
    .info-box { padding: 20px 18px; }
  }
</style>
</head>
<body>

<div class="container">

  <!-- SUCCESS BADGE -->
  <div class="success-badge fade-up">
    <div class="checkmark">
      <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
    </div>
    <h1>報名成功！</h1>
    <p>歡迎加入即興表達課，開課前我會寄行前通知到你的信箱。</p>
  </div>

  <!-- INFO BOX -->
  <div class="info-box fade-up fade-up-d1">
    <h3>接下來會發生什麼</h3>
    <p>1. 開課前一天，你會收到行前通知信，內容包含<strong>上課時間、地點及注意事項</strong>。</p>
    <p>2. 任何問題，直接回信到 <a href="mailto:dio3212@gmail.com" style="color:var(--gold)">dio3212@gmail.com</a>，我會親自回覆。</p>
    <p>3. 開課當天 <strong>10:00 準時開始</strong>，建議提早 15 分鐘到。</p>
  </div>

  <!-- SURVEY -->
  <div class="survey-section fade-up fade-up-d2" id="surveyBox">
    <h3>幫我一個忙｜你怎麼知道這門即興表達課的？</h3>
    <p class="survey-sub">點一下就好，你的答案會幫我很大的忙。</p>
    <div class="survey-grid" id="surveyGrid">
      <button class="survey-btn" data-answer="Threads"><span class="icon">🧵</span>Threads</button>
      <button class="survey-btn" data-answer="YouTube"><span class="icon">🎬</span>YouTube</button>
      <button class="survey-btn" data-answer="Instagram"><span class="icon">📷</span>Instagram</button>
      <button class="survey-btn" data-answer="Facebook"><span class="icon">📘</span>Facebook</button>
      <button class="survey-btn" data-answer="Email 電子報"><span class="icon">📧</span>Email 電子報</button>
      <button class="survey-btn" data-answer="Meta 廣告"><span class="icon">💰</span>Meta 廣告</button>
      <button class="survey-btn" data-answer="朋友介紹"><span class="icon">👥</span>朋友介紹</button>
      <button class="survey-btn" data-answer="Podcast / 媒體"><span class="icon">🎙️</span>Podcast / 媒體</button>
      <button class="survey-btn" data-answer="Google 搜尋"><span class="icon">🔍</span>Google 搜尋</button>
      <button class="survey-btn" data-answer="其他"><span class="icon">✨</span>其他</button>
    </div>
    <div class="survey-thanks" id="surveyThanks">
      謝謝你 🙏 你的答案幫了大忙
    </div>
  </div>

  <!-- FOOTER -->
  <div class="footer fade-up fade-up-d3">
    <p>有任何問題歡迎來信 <a href="mailto:dio3212@gmail.com">dio3212@gmail.com</a></p>
    <p style="margin-top: 8px;">© 2026 東區德學院</p>
  </div>

</div>

<script>
const SURVEY_ENDPOINT = "https://script.google.com/macros/s/AKfycbyK4jCiup8xuJTX6eGFEDLXIX9zqtqnoWbzVPnSCrjCvK9cwLey6871oFyAjkR8D2bFVA/exec";

document.querySelectorAll('.survey-btn').forEach(btn => {
  btn.addEventListener('click', async () => {
    const answer = btn.dataset.answer;
    document.querySelectorAll('.survey-btn').forEach(b => b.disabled = true);
    btn.style.background = 'var(--gold)';
    btn.style.color = 'var(--dark)';
    btn.style.borderColor = 'var(--gold)';

    // 過濾字面占位符
    const rawParams = Object.fromEntries(new URLSearchParams(window.location.search));
    const urlParams = {};
    for (const [k, v] of Object.entries(rawParams)) {
      if (v && !(v.startsWith('{') && v.endsWith('}'))) urlParams[k] = v;
    }
    const payload = {
      answer,
      url_params: urlParams,
      referrer: document.referrer || '',
      user_agent: navigator.userAgent,
      page: 'thank-you-inperson-course',
      timestamp: new Date().toISOString(),
    };

    if (SURVEY_ENDPOINT && !SURVEY_ENDPOINT.startsWith('REPLACE')) {
      try {
        await fetch(SURVEY_ENDPOINT, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload),
        });
      } catch (e) {
        console.warn('survey submit failed', e);
      }
    } else {
      console.log('SURVEY_ENDPOINT not set, would submit:', payload);
    }

    setTimeout(() => {
      document.getElementById('surveyGrid').style.display = 'none';
      document.getElementById('surveyThanks').classList.add('show');
    }, 600);
  });
});
</script>

</body>
</html>
